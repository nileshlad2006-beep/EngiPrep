services:
  - type: web
    name: engiprep
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        sync: false

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "5432"

      - key: DB_NAME
        sync: false

      - key: DB_USER
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: GEMINI_API_KEY
        sync: false